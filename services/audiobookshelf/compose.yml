services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.34.0
    container_name: audiobookshelf
    user: "${PUID:?set PUID, see .env.example}:${PGID:?set PGID, see .env.example}"
    ports:
      - "${ABS_PORT:-13378}:80"
    volumes:
      - "${MEDIA_ROOT:?set MEDIA_ROOT, see .env.example}/Library/Books:/books"
      - "${MEDIA_ROOT:?set MEDIA_ROOT, see .env.example}/Library/Audiobooks:/audiobooks"
      - "${MEDIA_ROOT:?set MEDIA_ROOT, see .env.example}/Library/Comics:/comics"
      - "${APPDATA_ROOT:?set APPDATA_ROOT, see .env.example}/audiobookshelf/config:/config"
      - "${APPDATA_ROOT:?set APPDATA_ROOT, see .env.example}/audiobookshelf/metadata:/metadata"
    environment:
      TZ: ${TZ:-Etc/UTC}
    restart: unless-stopped
