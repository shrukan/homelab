services:
  plex:
    image: plexinc/pms-docker:1.43.1.10611-1e34174b1
    container_name: plex
    network_mode: host
    volumes:
      - "${APPDATA_ROOT:?set APPDATA_ROOT, see .env.example}/plex/PlexMediaServer:/config"
      - "${APPDATA_ROOT:?set APPDATA_ROOT, see .env.example}/plex/transcode:/transcode"
      - "${MEDIA_ROOT:?set MEDIA_ROOT, see .env.example}/Library:/data"
    devices:
      - /dev/dri:/dev/dri
    environment:
      - "PLEX_UID=${PUID:?set PUID, see .env.example}"
      - "PLEX_GID=${PGID:?set PGID, see .env.example}"
      - "PLEX_CLAIM=${PLEX_CLAIM_TOKEN:-}"
      - "TZ=${TZ:-Etc/UTC}"
    restart: unless-stopped
