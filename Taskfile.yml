# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

dotenv:
  - .env.local

vars:
  SERVICE_DIR: services
  SERVICES: [audiobookshelf, sabnzbd, arr-stack, plex]

tasks:
  _service:
    internal: true
    requires:
      vars: [SERVICE]
    dir: "{{.SERVICE_DIR}}/{{.SERVICE}}"
    cmds:
      - docker compose {{.COMMAND}} {{.CLI_ARGS}}

  service:list:
    desc: List all the services
    cmd: echo "{{.SERVICES}}"

  service:init:
    desc: Create a service's directories and fix their ownership (once, and after moving them)
    requires:
      vars: [SERVICE]
    dir: "{{.SERVICE_DIR}}/{{.SERVICE}}"
    cmds:
      - '[ ! -f init.sh ] || ./init.sh'

  service:start:
    desc: Start a service (run service:init once before the first start)
    requires:
      vars: [SERVICE]
    cmds:
      - task: _service
        vars:
          SERVICE: "{{.SERVICE}}"
          COMMAND: up -d

  service:down:
    desc: Stop a service
    requires:
      vars: [SERVICE]
    dir: "{{.SERVICE_DIR}}/{{.SERVICE}}"
    cmds:
      - task: _service
        vars:
          SERVICE: "{{.SERVICE}}"
          COMMAND: down

  service:pull:
    desc: Pull the image of the service
    requires:
      vars: [SERVICE]
    dir: "{{.SERVICE_DIR}}/{{.SERVICE}}"
    cmds:
      - task: _service
        vars:
          SERVICE: "{{.SERVICE}}"
          COMMAND: pull

  backup:
    desc: Back up configuration data and the book libraries
    cmd: ./scripts/backup.sh backup

  backup:init:
    desc: Create the restic repository (run once)
    cmd: ./scripts/backup.sh init

  backup:check:
    desc: Verify the integrity of the backup repository
    cmd: ./scripts/backup.sh check

  backup:snapshots:
    desc: List the available backup snapshots
    cmd: ./scripts/backup.sh snapshots

  backup:restore:
    desc: Restore a snapshot, e.g. task backup:restore -- latest /tmp/restore
    cmd: ./scripts/backup.sh restore {{.CLI_ARGS}}

  service:update:
    desc: Pull image and restart container with the new image
    requires:
      vars: [SERVICE]
    dir: "{{.SERVICE_DIR}}/{{.SERVICE}}"
    cmds:
      - task: service:pull
        vars:
          SERVICE: "{{.SERVICE}}"
      - task: service:start
        vars:
          SERVICE: "{{.SERVICE}}"
